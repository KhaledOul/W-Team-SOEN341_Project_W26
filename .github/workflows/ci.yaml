name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Install ──────────────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

  # ─── Lint (JS/React) ──────────────────────────────────────────────────────
  lint-js:
    name: Lint — React & JS (ESLint)
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── Lint (CSS) ───────────────────────────────────────────────────────────
  lint-css:
    name: Lint — CSS (Stylelint)
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run Stylelint
        run: npm run lint:css

  # ─── Format check (Prettier) ──────────────────────────────────────────────
  format:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    needs: [install, lint-js, lint-css, format]
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Validate required secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          missing=0
          for var in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID \
            VITE_FIREBASE_MEASUREMENT_ID
          do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: ${var}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Vite build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 1

  # ─── Test (Playwright) ────────────────────────────────────────────────────
  test:
    name: Test (Playwright)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist/

      - name: Run Playwright tests
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 30

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (health check)
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci

      - name: Verify backend starts
        env:
          PORT: 3001
          FRONTEND_URL: http://localhost:5173
        run: |
          node src/index.js &
          sleep 2
          curl --fail http://localhost:3001/api/health

  # ─── Rollback on failure ─────────────────────────────────────────────────
  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs: [lint-js, lint-css, format, build, test, backend]
    if: >-
      always()
      && (needs.lint-js.result == 'failure'    || needs.lint-js.result == 'cancelled'
      ||  needs.lint-css.result == 'failure'   || needs.lint-css.result == 'cancelled'
      ||  needs.format.result == 'failure'     || needs.format.result == 'cancelled'
      ||  needs.build.result == 'failure'      || needs.build.result == 'cancelled'
      ||  needs.test.result == 'failure'       || needs.test.result == 'cancelled'
      ||  needs.backend.result == 'failure'    || needs.backend.result == 'cancelled')
    steps:
      # Push: already on the correct branch
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      # PR: checkout the source branch (head ref) so the revert lands there
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert last commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "::warning::Pipeline failed — reverting commit $(git rev-parse HEAD)"
          git revert --no-edit HEAD
          if [ "${{ github.event_name }}" = "push" ]; then
            git push origin ${{ github.ref_name }}
          else
            git push origin ${{ github.head_ref }}
          fi
          git commit --amend --no-edit --author="ddeeeeeppp <deep.patel0418@gmail.com>"
          if [ "${{ github.event_name }}" = "push" ]; then
            git push --force-with-lease origin ${{ github.ref_name }}
          else
            git push --force-with-lease origin ${{ github.head_ref }}
          fi
