name: Run Tests

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  # ─── Frontend unit tests (Vitest) ──────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: |
          cat <<EOF > .env.test
          VITE_FIREBASE_API_KEY=test
          VITE_FIREBASE_AUTH_DOMAIN=test
          VITE_FIREBASE_PROJECT_ID=test
          VITE_FIREBASE_STORAGE_BUCKET=test
          VITE_FIREBASE_MESSAGING_SENDER_ID=test
          VITE_FIREBASE_APP_ID=test
          EOF

      - name: Run Vitest
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ─── Functions unit tests (Jest) ───────────────────────────────────────────
  functions-tests:
    name: Functions Tests (Jest)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --ci --forceExit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/
